<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tela dividida · mapa e player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; background: #151616; color: #E3E3E3; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="noite" aberto="apps" badge="" hint-size="96px,720px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 12px 12px 0; display: flex; gap: 12px">
    <div style="flex: 1; min-width: 0; position: relative">
      <dc-import name="MapCard" theme="noite" modo="navegando" compacto="{{true}}" hint-size="100%,100%"></dc-import>
    </div>

    <section aria-label="Player" style="width: 600px; flex: none; box-sizing: border-box; padding: 16px 24px 18px; border-radius: 24px; background: {{cardBg}}; display: flex; flex-direction: column">
      <header style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: #1ED760; color: #04210F; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">S</span>
        <span style="flex: 1; font-size: 26px">Spotify</span>
        <a href="MediaQueue.dc.html" aria-label="Fila" style="width: 76px; height: 76px; border-radius: 38px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h12M3 12h12M3 18h7"></path><path d="M19 7v9"></path><circle cx="17" cy="17" r="2.2"></circle></svg></a>
        <a href="Media.dc.html" aria-label="Expandir player" style="width: 76px; height: 76px; border-radius: 38px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"></path></svg></a>
      </header>

      <div style="flex: 1; min-height: 0; display: flex; align-items: center; gap: 28px">
        <span aria-hidden="true" style="width: 240px; height: 240px; flex: none; border-radius: 20px; overflow: hidden; background: #1F8A9E">
          <svg viewBox="0 0 400 400" width="240" height="240"><rect width="400" height="400" fill="#2FA3B6"></rect><circle cx="250" cy="120" r="110" fill="#F0A9C9"></circle><ellipse cx="270" cy="320" rx="90" ry="140" fill="#F6D3BC" opacity="0.7"></ellipse><rect x="190" y="60" width="44" height="70" rx="22" fill="#14505C"></rect><rect y="300" width="400" height="100" fill="#F8D7DA"></rect></svg>
        </span>
        <div style="min-width: 0; flex: 1">
          <div style="font-size: 32px; font-weight: 500; line-height: 1.2">Nome da faixa</div>
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 6px"><span style="font-size: 24px; color: #C4C7C5">Artista</span><span aria-label="Explícito" style="width: 22px; height: 22px; border-radius: 4px; background: #C4C7C5; color: #151616; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">E</span></div>
          <div style="font-size: 22px; color: #C4C7C5; margin-top: 8px">1:34 / 3:45</div>
        </div>
      </div>

      <div role="slider" aria-label="Posição da faixa" aria-valuemin="0" aria-valuemax="225" aria-valuenow="94" tabindex="0" style="height: 40px; display: flex; align-items: center; position: relative">
        <div style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25)"><div style="width: 42%; height: 4px; border-radius: 2px; background: #FFFFFF"></div></div>
        <span style="position: absolute; left: calc(42% - 9px); width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF"></span>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
        <button type="button" aria-label="Aleatório" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg></button>
        <button type="button" aria-label="Faixa anterior" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M19 5.5v13L9.5 12z"></path></svg></button>
        <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 104px; height: 88px; border: 0; border-radius: 24px; background: #CFD6D3; color: #151616; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"></path></svg></sc-if>
        </button>
        <button type="button" aria-label="Próxima faixa" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"></path><path d="M5 5.5v13l9.5-6.5z"></path></svg></button>
        <button type="button" aria-label="Repetir" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg></button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tingir":{"editor":"boolean","default":true,"tsType":"fundo tingido pela cor da capa (spec 010)"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true };
  }
  renderVals() {
    const playing = this.state.playing;
    return {
      cardBg: (this.props.tingir ?? true) ? '#15434B' : '#262625',
      playing,
      paused: !playing,
      playLabel: playing ? 'Pausar' : 'Tocar',
      togglePlay: () => this.setState({ playing: !this.state.playing })
    };
  }
}
</script>
</body>
</html>
