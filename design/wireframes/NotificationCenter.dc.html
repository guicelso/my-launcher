<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Central de notificações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; background: #151616; color: #E3E3E3; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="noite" aberto="apps" badge="" hint-size="96px,720px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 12px 12px 0; display: flex; gap: 12px">
    <section aria-label="Central de notificações" style="flex: 1; min-width: 0; border-radius: 24px; background: #1B1D1C; display: flex; overflow: hidden">
      <div aria-hidden="true" style="width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; padding: 28px 0">
        <span style="width: 4px; height: 120px; border-radius: 2px; background: #C4C7C5"></span>
      </div>
      <div style="flex: 1; min-width: 0; overflow-y: auto; box-sizing: border-box; padding: 24px 40px 24px 0; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{cards}}" as="n" hint-placeholder-count="3">
          <article style="flex: none; box-sizing: border-box; padding: 18px 20px; border-radius: 24px; background: #252726; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; align-items: center; gap: 18px">
              <span style="position: relative; width: 72px; height: 72px; flex: none; border-radius: 36px; background: {{n.avatarBg}}; color: {{n.avatarFg}}; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500">
                <sc-if value="{{n.isPerson}}" hint-placeholder-val="{{true}}">{{n.initials}}</sc-if>
                <sc-if value="{{n.isReminder}}" hint-placeholder-val="{{false}}"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><circle cx="15" cy="15" r="1.6" fill="currentColor"></circle></svg></sc-if>
                <sc-if value="{{n.isPerson}}" hint-placeholder-val="{{true}}"><span style="position: absolute; right: -4px; bottom: -4px; width: 30px; height: 30px; border-radius: 15px; background: {{n.appBg}}; border: 3px solid #252726; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{n.appIcon}}"></path></svg></span></sc-if>
              </span>
              <span style="flex: 1; min-width: 0">
                <span style="display: block; font-size: 26px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span>
                <span style="display: block; font-size: 22px; color: #C4C7C5; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.text}}</span>
              </span>
              <sc-if value="{{n.hasCount}}" hint-placeholder-val="{{false}}"><span aria-label="{{n.count}} mensagens" style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #C7C9C8; color: #151616; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500">{{n.count}}</span></sc-if>
            </div>
            <sc-if value="{{n.hasActions}}" hint-placeholder-val="{{true}}">
              <div style="display: flex; gap: 12px">
                <sc-for list="{{n.actions}}" as="a" hint-placeholder-count="3">
                  <a href="{{a.href}}" aria-label="{{a.label}}" style="flex: {{a.flex}}; height: 72px; border-radius: 36px; background: #3C3E3D; color: #E3E3E3; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 22px; font-weight: 500; text-decoration: none">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.icon}}"></path></svg>
                    <sc-if value="{{a.showText}}" hint-placeholder-val="{{true}}"><span>{{a.label}}</span></sc-if>
                  </a>
                </sc-for>
              </div>
            </sc-if>
          </article>
        </sc-for>
        <button type="button" style="align-self: center; flex: none; margin-top: 8px; height: 64px; padding: 0 32px; border: 1px solid #5F6368; border-radius: 32px; background: transparent; color: #E3E3E3; font: inherit; font-size: 20px; font-weight: 500; cursor: pointer">Limpar tudo</button>
      </div>
    </section>

    <div style="width: 420px; flex: none; position: relative">
      <dc-import name="MapCard" theme="noite" modo="navegando" compacto="{{true}}" hint-size="100%,100%"></dc-import>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"filtro":{"editor":"enum","options":["todas","mensagens"],"default":"todas"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      play: 'M7 4.5v15l12-7.5z',
      reply: 'M9 6 4 11l5 5M4 11h10a6 6 0 0 1 6 6v1',
      mute: 'M13.7 21a2 2 0 0 1-3.4 0M18.6 13A17.9 17.9 0 0 1 18 8M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.3-5M3 3l18 18',
      phone: 'M20 15.5c-1.2 0-2.4-.2-3.6-.6a1 1 0 0 0-1 .25l-2.2 2.2a15 15 0 0 1-6.6-6.6l2.2-2.2a1 1 0 0 0 .25-1A11.4 11.4 0 0 1 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1 17 17 0 0 0 17 17 1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z',
      msg: 'M4 4h16v12H8l-4 4zM8 10h.01M12 10h.01M16 10h.01',
      nav: 'M12 3 5 21l7-4 7 4z',
      bubble: 'M4 4h16v12H8l-4 4z'
    };
    const act = (label, icon, href, showText, flex) => ({ label, icon, href, showText, flex: flex ?? (showText ? '1.6' : '1') });
    const all = [
      { kind: 'msg', title: 'Mariana Souza · 8 min', text: 'Você chega que horas? Já estou aqui…', initials: 'MS', avatarBg: '#8E6BBF', avatarFg: '#FFFFFF', appBg: '#1A73E8', appIcon: I.bubble, count: '3',
        actions: [act('Ouvir', I.play, 'VoiceReply.dc.html', true), act('Responder', I.reply, 'VoiceReply.dc.html', true), act('Silenciar conversa', I.mute, 'NotificationCenter.dc.html', false)] },
      { kind: 'msg', title: 'Lucas Moreira · 12 min', text: 'Onde você está?', initials: 'LM', avatarBg: '#C26A3D', avatarFg: '#FFFFFF', appBg: '#25D366', appIcon: I.bubble, count: '',
        actions: [act('Ouvir', I.play, 'VoiceReply.dc.html', true), act('Responder', I.reply, 'VoiceReply.dc.html', true), act('Silenciar conversa', I.mute, 'NotificationCenter.dc.html', false)] },
      { kind: 'call', title: 'Pedro Lima', text: 'Chamada perdida · 25 min', initials: 'PL', avatarBg: '#3B7A57', avatarFg: '#FFFFFF', appBg: '#1A73E8', appIcon: I.phone, count: '',
        actions: [act('Ligar de volta', I.phone, 'HunCall.dc.html', true, '1'), act('Mensagem', I.msg, 'VoiceReply.dc.html', true, '1')] },
      { kind: 'reminder', title: 'Buscar o bolo de aniversário', text: '13:00 – 16:30 · Padaria Real', initials: '', avatarBg: '#004B72', avatarFg: '#C2E7FF', appBg: '', appIcon: '', count: '',
        actions: [act('Navegar', I.nav, 'MapFull.dc.html', true, '1')] }
    ];
    const onlyMsg = (this.props.filtro ?? 'todas') === 'mensagens';
    const cards = all.filter((n) => !onlyMsg || n.kind === 'msg').map((n) => ({
      ...n,
      isPerson: n.kind !== 'reminder',
      isReminder: n.kind === 'reminder',
      hasCount: n.count !== '',
      hasActions: n.actions.length > 0
    }));
    return { cards };
  }
}
</script>
</body>
</html>
