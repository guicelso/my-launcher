<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tela dividida · mapa e player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; background: #151616; color: #E3E3E3; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="noite" aberto="apps" badge="" hint-size="96px,720px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 12px 12px 0; display: flex; gap: 12px">
    <div style="flex: 1; min-width: 0; position: relative">
      <dc-import name="MapCard" theme="noite" modo="navegando" compacto="{{true}}" hint-size="100%,100%"></dc-import>
    </div>

    <section aria-label="Player" style="width: 600px; flex: none; position: relative; border-radius: 24px; background: #262625; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: -60px; filter: blur(56px) saturate(1.15); opacity: 0.9">
        <svg viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="400" height="400" fill="#1D5C63"></rect><circle cx="250" cy="130" r="120" fill="#F6B26B"></circle><ellipse cx="110" cy="300" rx="130" ry="90" fill="#E98A7B"></ellipse></svg>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12, 13, 13, 0.6)"></div>

      <div style="position: relative; height: 100%; box-sizing: border-box; padding: 14px 20px 18px; display: flex; flex-direction: column">
        <header style="height: 76px; flex: none; display: flex; align-items: center; gap: 8px">
          <a href="MxSources.dc.html" aria-label="Trocar app de mídia (Sonora)" style="height: 60px; padding: 0 14px 0 6px; border-radius: 30px; display: flex; align-items: center; gap: 10px; color: #E3E3E3; text-decoration: none; background: rgba(255,255,255,0.08)">
            <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; background: #F6B26B; color: #3A2300; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"></path></svg></span>
            <span style="font-size: 22px">Sonora</span>
          </a>
          <span style="flex: 1"></span>
          <a href="MxQueue.dc.html" aria-label="Fila" style="width: 76px; height: 76px; border-radius: 38px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h12M3 12h12M3 18h7"></path><path d="M19 7v9"></path><circle cx="17" cy="17" r="2.2"></circle></svg></a>
          <a href="MxPlayer.dc.html" aria-label="Expandir player" style="width: 76px; height: 76px; border-radius: 38px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"></path></svg></a>
        </header>

        <div style="flex: 1; min-height: 0; display: flex; align-items: center; gap: 24px">
          <span aria-hidden="true" style="width: 210px; height: 210px; flex: none; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 24px rgba(0,0,0,0.45)"><svg viewBox="0 0 400 400" width="210" height="210"><rect width="400" height="400" fill="#1D5C63"></rect><circle cx="250" cy="130" r="120" fill="#F6B26B"></circle><ellipse cx="110" cy="300" rx="130" ry="90" fill="#E98A7B"></ellipse><rect x="60" y="60" width="70" height="70" rx="35" fill="#FCE4C4"></rect></svg></span>
          <div style="min-width: 0; flex: 1">
            <div style="font-size: 30px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">Estrada de terra ao entardecer</div>
            <a href="MxAlbum.dc.html" style="margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 23px; color: #D6D9D7; text-decoration: none">Banda Fictícia<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
            <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px; color: #B8BBB9">
              <span aria-label="Explícito" style="width: 22px; height: 22px; border-radius: 4px; background: #C4C7C5; color: #151616; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">E</span>
              <svg aria-label="Baixado" role="img" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
            </div>
          </div>
        </div>

        <div role="slider" aria-label="Posição" aria-valuemin="0" aria-valuemax="225" aria-valuenow="94" tabindex="0" style="height: 36px; position: relative; flex: none">
          <svg width="560" height="24" viewBox="0 0 560 24" aria-hidden="true" style="position: absolute; left: 0; top: 6px"><path d="{{wave}}" fill="none" stroke="#F6B26B" stroke-width="5" stroke-linecap="round"></path><path d="M245 12 L557 12" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="5" stroke-linecap="round"></path></svg>
          <span style="position: absolute; left: 232px; top: 2px; width: 8px; height: 32px; border-radius: 4px; background: #FFFFFF"></span>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 20px; color: #B8BBB9; flex: none"><span>1:34</span><span>−2:11</span></div>

        <div role="group" aria-label="Controles" style="flex: none; margin-top: 10px; display: flex; align-items: center; justify-content: space-between">
          <button type="button" aria-label="Curtir" style="width: 80px; height: 80px; border: 0; border-radius: 40px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-8.5-5.2-8.5-11A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 8.5 2.9c0 5.8-8.5 11-8.5 11z"></path></svg></button>
          <button type="button" aria-label="Faixa anterior" style="width: 80px; height: 80px; border: 0; border-radius: 40px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M19 5.5v13L9.5 12z"></path></svg></button>
          <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 120px; height: 96px; border: 0; border-radius: {{playRadius}}; background: #CFD6D3; color: #151616; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect></svg></sc-if>
            <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="46" height="46" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"></path></svg></sc-if>
          </button>
          <button type="button" aria-label="Próxima faixa" style="width: 80px; height: 80px; border: 0; border-radius: 40px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14M5 5.5v13l9.5-6.5z"></path></svg></button>
          <a href="MxPlayerMore.dc.html" aria-label="Mais ações" style="width: 80px; height: 80px; border-radius: 40px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg></a>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true };
  }
  renderVals() {
    let wave = 'M3 12';
    for (let i = 3; i <= 236; i += 4) wave += ' L' + i + ' ' + (12 + 5 * Math.sin(i / 7)).toFixed(1);
    const playing = this.state.playing;
    return {
      wave, playing, paused: !playing,
      playLabel: playing ? 'Pausar' : 'Tocar',
      playRadius: playing ? '26px' : '48px',
      togglePlay: () => this.setState({ playing: !playing })
    };
  }
}
</script>
</body>
</html>
