<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel com card de mídia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; background: #151616; color: #E3E3E3; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="noite" aberto="painel" badge="" hint-size="96px,720px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 12px 12px 0; display: flex; gap: 12px">
    <div style="flex: 1; min-width: 0; position: relative">
      <dc-import name="MapCard" theme="noite" modo="navegando" compacto="{{true}}" hint-size="100%,100%"></dc-import>
    </div>

    <div style="width: 408px; flex: none; display: flex; flex-direction: column; gap: 12px">
      <section aria-label="Mídia" style="height: 452px; flex: none; position: relative; border-radius: 24px; background: #262625; overflow: hidden">
        <div aria-hidden="true" style="position: absolute; inset: -60px; filter: blur(48px) saturate(1.2); opacity: 0.9">
          <svg viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="400" height="400" fill="{{art.a}}"></rect><circle cx="250" cy="130" r="120" fill="{{art.b}}"></circle><ellipse cx="110" cy="300" rx="130" ry="90" fill="{{art.c}}"></ellipse></svg>
        </div>
        <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12, 13, 13, 0.6)"></div>

        <div style="position: relative; height: 100%; box-sizing: border-box; padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 12px">
          <header style="height: 48px; flex: none; display: flex; align-items: center; gap: 10px">
            <a href="MxSources.dc.html" aria-label="Trocar app de mídia (Sonora)" style="height: 48px; padding: 0 12px 0 4px; border-radius: 24px; display: flex; align-items: center; gap: 10px; color: #E3E3E3; text-decoration: none">
              <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 18px; background: #F6B26B; color: #3A2300; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"></path></svg></span>
              <span style="font-size: 22px">Sonora</span>
            </a>
            <span style="flex: 1"></span>
            <a href="MxSplit.dc.html" aria-label="Abrir o player" style="width: 64px; height: 64px; border-radius: 32px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"></path></svg></a>
          </header>

          <sc-if value="{{playingCard}}" hint-placeholder-val="{{true}}">
            <a href="MxSplit.dc.html" style="display: flex; align-items: center; gap: 18px; color: #E3E3E3; text-decoration: none">
              <span aria-hidden="true" style="width: 128px; height: 128px; flex: none; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.4)"><svg viewBox="0 0 400 400" width="128" height="128"><rect width="400" height="400" fill="#1D5C63"></rect><circle cx="250" cy="130" r="120" fill="#F6B26B"></circle><ellipse cx="110" cy="300" rx="130" ry="90" fill="#E98A7B"></ellipse><rect x="60" y="60" width="70" height="70" rx="35" fill="#FCE4C4"></rect></svg></span>
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 26px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">Estrada de terra ao entardecer</span>
                <span style="display: flex; align-items: center; gap: 8px; font-size: 21px; color: #D0D3D1">Banda Fictícia<span aria-label="Explícito" style="width: 20px; height: 20px; border-radius: 4px; background: #C4C7C5; color: #151616; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">E</span></span>
              </span>
            </a>
            <div aria-label="1:34 de 3:45" style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.28); margin: 4px 0"><div style="width: 42%; height: 4px; border-radius: 2px; background: #F6B26B"></div></div>
            <div role="group" aria-label="Controles" style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
              <button type="button" aria-label="Faixa anterior" style="width: 80px; height: 80px; border: 0; border-radius: 40px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M19 5.5v13L9.5 12z"></path></svg></button>
              <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 112px; height: 88px; border: 0; border-radius: {{playRadius}}; background: #CFD6D3; color: #151616; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect></svg></sc-if>
                <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"></path></svg></sc-if>
              </button>
              <button type="button" aria-label="Próxima faixa" style="width: 80px; height: 80px; border: 0; border-radius: 40px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14M5 5.5v13l9.5-6.5z"></path></svg></button>
            </div>
            <div role="group" aria-label="Ações do app" style="display: flex; justify-content: space-around">
              <button type="button" aria-label="Aleatório" aria-pressed="true" style="width: 76px; height: 64px; border: 0; border-radius: 32px; background: rgba(255,255,255,0.16); color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg></button>
              <button type="button" aria-label="Repetir" aria-pressed="false" style="width: 76px; height: 64px; border: 0; border-radius: 32px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg></button>
              <button type="button" aria-label="Curtir" aria-pressed="false" style="width: 76px; height: 64px; border: 0; border-radius: 32px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-8.5-5.2-8.5-11A4.8 4.8 0 0 1 12 6.6a4.8 4.8 0 0 1 8.5 2.9c0 5.8-8.5 11-8.5 11z"></path></svg></button>
            </div>
          </sc-if>

          <sc-if value="{{suggestCard}}" hint-placeholder-val="{{false}}">
            <div style="font-size: 20px; color: #D0D3D1; margin-top: -2px">Continue ouvindo</div>
            <div style="display: flex; align-items: center; gap: 18px">
              <span aria-hidden="true" style="width: 150px; height: 150px; flex: none; border-radius: 18px; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,0.4)"><svg viewBox="0 0 400 400" width="150" height="150"><rect width="400" height="400" fill="#5B3A1E"></rect><circle cx="250" cy="130" r="120" fill="#FDD663"></circle><ellipse cx="110" cy="300" rx="130" ry="90" fill="#81C995"></ellipse></svg></span>
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 26px">Viagem longa</span>
                <span style="font-size: 20px; color: #D0D3D1">Playlist · 48 músicas</span>
              </span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px">
              <a href="MxSplit.dc.html" style="flex: 1; height: 76px; border-radius: 38px; background: #CFD6D3; color: #151616; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 24px; font-weight: 500; text-decoration: none"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"></path></svg>Tocar</a>
              <button type="button" aria-label="Próxima sugestão" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: rgba(255,255,255,0.14); color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
            </div>
            <div aria-label="Sugestão 2 de 10" style="display: flex; justify-content: center; gap: 8px; margin-top: auto">
              <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.4)"></span>
              <span style="width: 22px; height: 8px; border-radius: 4px; background: #FFFFFF"></span>
              <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.4)"></span>
              <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.4)"></span>
              <span style="width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.4)"></span>
            </div>
          </sc-if>
        </div>
      </section>

      <section aria-label="Data e clima" style="flex: 1; min-height: 0; border-radius: 24px; background: #262625; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <span style="font-size: 56px; font-weight: 300">18:33</span>
        <span style="font-size: 21px; color: #C4C7C5">Domingo, 22 de novembro</span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 22px; margin-top: 6px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FDD663" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.6A3.3 3.3 0 0 0 7 18z"></path></svg>24° · Parcialmente nublado</span>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","options":["tocando","sugestoes"],"default":"tocando","tsType":"tocando ou nada tocando (sugestões do app)"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true };
  }
  renderVals() {
    const sug = (this.props.estado ?? 'tocando') === 'sugestoes';
    const playing = this.state.playing;
    return {
      playingCard: !sug, suggestCard: sug,
      art: sug ? { a: '#5B3A1E', b: '#FDD663', c: '#81C995' } : { a: '#1D5C63', b: '#F6B26B', c: '#E98A7B' },
      playing, paused: !playing,
      playLabel: playing ? 'Pausar' : 'Tocar',
      playRadius: playing ? '24px' : '44px',
      togglePlay: () => this.setState({ playing: !playing })
    };
  }
}
</script>
</body>
</html>
