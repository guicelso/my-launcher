</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: Roboto, system-ui, sans-serif; color: #E3E3E3">

      </a>
      <span aria-label="3 mensagens" style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #D3E3FD; color: #002C6F; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500">3</span>
      <a href="VoiceReply.dc.html" aria-label="Responder" style="width: 112px; height: 76px; flex: none; border-radius: 38px; background: #3B3E3D; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6 4 11l5 5"></path><path d="M4 11h10a6 6 0 0 1 6 6v1"></path></svg></a>

    </div>
  </sc-if>

  <sc-if value="{{isCall}}" hint-placeholder-val="{{false}}">
    <div role="alert" style="position: absolute; top: 12px; left: 96px; width: 772px; box-sizing: border-box; padding: 16px 16px 18px 20px; border-radius: 24px; background: #292A2A; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.6)">

        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 28px; font-weight: 500">Mariana Souza</span><span style="display: block; font-size: 22px; color: #A2A3A5; margin-top: 2px">Chamada recebida · (11) 98765-4321</span></span>

      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
        <button type="button" style="height: 76px; border: 0; border-radius: 38px; background: #5BBF6B; color: #0B3D17; font: inherit; font-size: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6a1 1 0 0 0-1 .25l-2.2 2.2a15 15 0 0 1-6.6-6.6l2.2-2.2a1 1 0 0 0 .25-1A11.4 11.4 0 0 1 8.5 4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1 17 17 0 0 0 17 17 1 1 0 0 0 1-1v-3.5a1 1 0 0 0-1-1z"></path></svg>Atender</button>

        <button type="button" style="height: 76px; border: 0; border-radius: 38px; background: #3B3E3D; color: #E3E3E3; font: inherit; font-size: 22px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"></path><path d="M8 10h.01M12 10h.01M16 10h.01" stroke-linecap="round" stroke-width="2.6"></path></svg>Mensagem</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isNav}}" hint-placeholder-val="{{false}}">
    <div role="alert" style="position: absolute; top: 12px; left: 96px; width: 772px; box-sizing: border-box; padding: 14px 14px 14px 24px; border-radius: 24px; background: #243037; display: flex; align-items: center; gap: 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.6)">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M15 4l5 5-5 5"></path><path d="M20 9h-9a6 6 0 0 0-6 6v5"></path></svg>
      <a href="MapFull.dc.html" style="flex: 1; min-width: 0; color: #FFFFFF; text-decoration: none"><span style="display: block; font-size: 32px; font-weight: 500">300 m</span><span style="display: block; font-size: 24px; color: #C9D3D8; margin-top: 2px">Av. Rebouças</span></a>
      <a href="Media.dc.html" aria-label="Dispensar" style="width: 76px; height: 76px; flex: none; border-radius: 38px; color: #C9D3D8; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
  </sc-if>

  <sc-if value="{{isReminder}}" hint-placeholder-val="{{false}}">
    <div role="alert" style="position: absolute; top: 12px; left: 96px; width: 772px; box-sizing: border-box; padding: 14px 14px 14px 18px; border-radius: 24px; background: #292A2A; display: flex; align-items: center; gap: 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.6)">
      <span style="width: 72px; height: 72px; flex: none; border-radius: 36px; background: #004B72; color: #C2E7FF; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path><circle cx="15" cy="15" r="1.6" fill="currentColor"></circle></svg></span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 28px; font-weight: 500">Buscar o bolo de aniversário</span><span style="display: flex; align-items: center; gap: 10px; font-size: 22px; color: #A2A3A5; margin-top: 2px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 21l7-4 7 4z"></path></svg>13:00 – 16:30 · Padaria Real</span></span>
      <a href="MapFull.dc.html" aria-label="Navegar até o local" style="width: 112px; height: 76px; flex: none; border-radius: 38px; background: #3B3E3D; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 21l7-4 7 4z"></path></svg></a>
      <a href="NotificationCenter.dc.html" aria-label="Dispensar" style="width: 76px; height: 76px; flex: none; border-radius: 38px; color: #C4C7C5; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
  </sc-if>

  <sc-if value="{{isWhats}}" hint-placeholder-val="{{false}}">
    <div role="alert" style="position: absolute; top: 12px; left: 96px; width: 772px; box-sizing: border-box; padding: 16px 16px 18px 20px; border-radius: 24px; background: #292A2D; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.6)">
      <div style="display: flex; align-items: center; gap: 18px">
        <span style="position: relative; width: 72px; height: 72px; flex: none; border-radius: 36px; background: #C26A3D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500">LM<span style="position: absolute; right: -4px; bottom: -4px; width: 30px; height: 30px; border-radius: 15px; background: #25D366; border: 3px solid #292A2D; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"></path></svg></span></span>
        <a href="VoiceReply.dc.html" style="flex: 1; min-width: 0; color: #E3E3E3; text-decoration: none"><span style="display: block; font-size: 28px; font-weight: 500">Lucas Moreira</span><span style="display: block; font-size: 22px; color: #A2A3A5; margin-top: 2px">Nova mensagem</span></a>
        <a href="MessageCenter.dc.html" aria-label="Dispensar" style="width: 76px; height: 76px; flex: none; border-radius: 38px; color: #C4C7C5; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      </div>
      <div style="display: flex; gap: 14px">
        <a href="VoiceReply.dc.html" style="height: 76px; padding: 0 40px; border-radius: 38px; background: #3C4043; color: #E3E3E3; display: flex; align-items: center; font-size: 22px; font-weight: 500; text-decoration: none">Ouvir</a>
        <button type="button" style="height: 76px; padding: 0 40px; border: 0; border-radius: 38px; background: #3C4043; color: #E3E3E3; font: inherit; font-size: 22px; font-weight: 500; cursor: pointer">Silenciar conversa</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tipo":{"editor":"enum","options":["mensagem","chamada","navegacao","lembrete","whatsapp"],"default":"mensagem"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tipo ?? 'mensagem';
    return {
      baseDash: t !== 'navegacao',
      baseMedia: t === 'navegacao',
      badge: t === 'chamada' ? '' : '4',
      isMsg: t === 'mensagem',
      isCall: t === 'chamada',
      isNav: t === 'navegacao',
      isReminder: t === 'lembrete',
      isWhats: t === 'whatsapp'
    };
  }
}
</script>
</body>
</html>
