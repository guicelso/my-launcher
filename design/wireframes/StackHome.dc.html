<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel com pilhas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; display: flex; background: {{c.bg}}; color: {{c.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="{{theme}}" badge="3" clima="{{false}}" hint-size="96px,720px"></dc-import>

  <main style="flex: 1; min-width: 0; min-height: 0; box-sizing: border-box; padding: 12px 12px 12px 0; display: flex; gap: 12px">
    <div style="flex: 1; min-width: 0; position: relative">
      <dc-import name="MapCard" theme="{{theme}}" modo="navegando" hint-size="100%,100%"></dc-import>
    </div>

    <div style="width: 408px; flex: none; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="flex: 1; min-height: 0; position: relative; z-index: {{topZ}}; border-radius: 24px; box-shadow: {{topShadow}}">
        <dc-import name="StackCard" theme="{{theme}}" widgets="{{top}}" start="0" on-long-press="{{openTop}}" on-change="{{setTopIdx}}" hint-size="100%,100%"></dc-import>
      </div>
      <div style="height: 236px; flex: none; position: relative; z-index: {{bottomZ}}; border-radius: 24px; box-shadow: {{bottomShadow}}">
        <dc-import name="StackCard" theme="{{theme}}" widgets="{{bottom}}" start="0" on-long-press="{{openBottom}}" on-change="{{setBottomIdx}}" hint-size="100%,236px"></dc-import>
      </div>
    </div>
  </main>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
    <button type="button" aria-label="Fechar menu" onClick="{{close}}" style="position: absolute; inset: 0; z-index: 5; border: 0; padding: 0; background: rgba(0,0,0,0.55); cursor: default"></button>
    <div role="menu" aria-label="{{menuTitle}}" style="position: absolute; left: 448px; top: {{menuTop}}px; z-index: 7; width: 400px; box-sizing: border-box; padding: 8px 0; border-radius: 24px; background: {{c.menu}}; color: {{c.text}}; box-shadow: 0 8px 24px rgba(0,0,0,0.5)">
      <div style="padding: 12px 24px 14px">
        <div style="font-size: 24px; font-weight: 500">{{menuTitle}}</div>
        <div style="font-size: 18px; color: {{c.muted}}; margin-top: 2px">{{menuSub}}</div>
      </div>
      <div style="height: 1px; background: {{c.line}}"></div>
      <a href="StackEdit.dc.html" role="menuitem" style="height: 76px; color: {{c.text}}; text-decoration: none; font-size: 22px; display: flex; align-items: center; gap: 18px; padding: 0 24px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5z"></path><path d="M2 13l10 5 10-5"></path><path d="M2 17.5l10 5 10-5"></path></svg>Editar pilha</a>
      <a href="StackAdd.dc.html" role="menuitem" style="height: 76px; color: {{c.text}}; text-decoration: none; font-size: 22px; display: flex; align-items: center; gap: 18px; padding: 0 24px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><path d="M12 8v8M8 12h8"></path></svg>Adicionar widget à pilha</a>
      <a href="WidgetPicker.dc.html" role="menuitem" style="height: 76px; color: {{c.text}}; text-decoration: none; font-size: 22px; display: flex; align-items: center; gap: 18px; padding: 0 24px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>Trocar este widget</a>
      <div style="height: 1px; margin: 4px 0; background: {{c.line}}"></div>
      <button type="button" role="menuitem" onClick="{{removeCurrent}}" style="width: 100%; height: 76px; border: 0; background: transparent; color: {{c.danger}}; font: inherit; font-size: 22px; display: flex; align-items: center; gap: 18px; padding: 0 24px; cursor: pointer; text-align: left"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg>Remover {{currentName}} da pilha</button>
      <div style="padding: 6px 24px 10px; font-size: 17px; color: {{c.muted}}">Editar só com o carro parado</div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["noite","dia"],"default":"noite"},"menu":{"editor":"enum","options":["nenhum","cima","baixo"],"default":"nenhum","tsType":"abre o menu do toque longo numa das pilhas"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const m = props.menu ?? 'nenhum';
    this.state = {
      top: ['midia', 'clima', 'veiculo'],
      bottom: ['destinos', 'hora', 'relogio', 'notificacoes'],
      topIdx: 0,
      bottomIdx: 0,
      menu: m === 'cima' || m === 'baixo' ? m : null
    };
  }
  renderVals() {
    const P = {
      noite: { bg: '#151616', text: '#E3E3E3', muted: '#A8ABAE', menu: '#2B2C2E', line: '#3C3E3D', danger: '#F28B82' },
      dia: { bg: '#E9EBEE', text: '#1F1F1F', muted: '#5F6368', menu: '#FFFFFF', line: '#E0E2E6', danger: '#B3261E' }
    };
    const theme = this.props.theme === 'dia' ? 'dia' : 'noite';
    const names = { midia: 'Mídia', clima: 'Clima agora', hora: 'Clima por hora', veiculo: 'Veículo', destinos: 'Destinos', relogio: 'Relógio', notificacoes: 'Notificações' };
    const s = this.state;
    const isTop = s.menu === 'cima';
    const list = isTop ? s.top : s.bottom;
    const cur = list[Math.min(isTop ? s.topIdx : s.bottomIdx, list.length - 1)] || '';
    const lift = '0 0 0 4px #A8C7FA, 0 10px 28px rgba(0,0,0,0.55)';
    return {
      c: P[theme],
      theme,
      top: s.top.join(','),
      bottom: s.bottom.join(','),
      menuOpen: !!s.menu,
      menuTop: isTop ? 40 : 288,
      menuTitle: isTop ? 'Pilha de cima' : 'Pilha de baixo',
      menuSub: list.length + (list.length === 1 ? ' widget' : ' widgets') + ' · mostrando ' + (names[cur] || ''),
      currentName: names[cur] || 'widget',
      topZ: s.menu === 'cima' ? 6 : 'auto',
      bottomZ: s.menu === 'baixo' ? 6 : 'auto',
      topShadow: s.menu === 'cima' ? lift : 'none',
      bottomShadow: s.menu === 'baixo' ? lift : 'none',
      openTop: () => this.setState({ menu: 'cima' }),
      openBottom: () => this.setState({ menu: 'baixo' }),
      setTopIdx: (i) => this.setState({ topIdx: i }),
      setBottomIdx: (i) => this.setState({ bottomIdx: i }),
      close: () => this.setState({ menu: null }),
      removeCurrent: () => {
        const key = isTop ? 'top' : 'bottom';
        const next = list.filter((id) => id !== cur);
        if (next.length === 0) { this.setState({ menu: null }); return; }
        this.setState({ [key]: next, menu: null });
      }
    };
  }
}
</script>
</body>
</html>
