<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; flex-direction: {{dir}}; background: {{c.bg}}; color: {{c.text}}; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <sc-if value="{{isVertical}}" hint-placeholder-val="{{true}}">
    <dc-import name="Rail" theme="{{theme}}" badge="{{badge}}" clima="{{clima}}" hint-size="96px,720px"></dc-import>
  </sc-if>

  <main style="flex: 1; min-width: 0; min-height: 0; box-sizing: border-box; padding: {{pad}}; display: flex; gap: 12px">
    <div style="flex: 1; min-width: 0; position: relative">
      <dc-import name="MapCard" theme="{{theme}}" modo="{{nav}}" hint-size="100%,100%"></dc-import>
    </div>

    <div style="width: 408px; flex: none; min-height: 0; display: flex; flex-direction: column; gap: 12px">
      <sc-if value="{{showMsg}}" hint-placeholder-val="{{true}}">
        <section aria-label="Mensagem nova" style="order: 0; flex: none; box-sizing: border-box; padding: 18px 18px 18px; border-radius: 24px; background: {{c.card}}; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; align-items: center; gap: 16px">
            <span style="position: relative; width: 68px; height: 68px; flex: none; border-radius: 34px; background: #8E6BBF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500">MS
              <span style="position: absolute; right: -4px; bottom: -4px; width: 28px; height: 28px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 11px; background: #25D366; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"></path></svg></span></span>
            </span>
            <span style="min-width: 0">
              <span style="display: block; font-size: 28px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mariana Souza</span>
              <span style="display: block; font-size: 22px; color: {{c.muted}}; margin-top: 2px">Nova mensagem</span>
            </span>
          </div>
          <div style="display: flex; gap: 14px">
            <a href="VoiceReply.dc.html" aria-label="Ler em voz alta" style="flex: 1; height: 76px; border-radius: 38px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg></a>
            <a href="VoiceReply.dc.html" aria-label="Responder" style="flex: 1; height: 76px; border-radius: 38px; background: {{c.pill}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6 4 11l5 5"></path><path d="M4 11h10a6 6 0 0 1 6 6v1"></path></svg></a>
          </div>
        </section>
      </sc-if>

      <section aria-label="Tocando agora" style="order: {{mediaOrder}}; flex: 1; min-height: 0; position: relative; border-radius: 24px; overflow: hidden; background: #1F8A9E">
        <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%">
          <defs><linearGradient id="art" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FB4C6"></stop><stop offset="1" stop-color="#16707F"></stop></linearGradient></defs>
          <rect width="400" height="400" fill="url(#art)"></rect>
          <circle cx="250" cy="120" r="110" fill="#F0A9C9" opacity="0.85"></circle>
          <ellipse cx="270" cy="300" rx="90" ry="140" fill="#F6D3BC" opacity="0.6"></ellipse>
          <rect x="190" y="60" width="44" height="70" rx="22" fill="#14505C"></rect>
          <rect x="0" y="0" width="400" height="400" fill="#000000" opacity="0.18"></rect>
        </svg>
        <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 25%, rgba(0,0,0,0.55) 100%)"></div>
        <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 18px 22px 14px; display: flex; flex-direction: column; color: #FFFFFF">
          <div style="display: flex; justify-content: flex-end">
            <span aria-label="Spotify" style="width: 36px; height: 36px; border-radius: 18px; background: #1ED760; color: #04210F; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">S</span>
          </div>
          <a href="MediaSplit.dc.html" style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; color: #FFFFFF; text-decoration: none">
            <span style="font-size: 30px; font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nome da faixa</span>
            <span style="font-size: 22px; opacity: 0.88; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Artista</span>
          </a>
          <div aria-hidden="true" style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.35); margin: 14px 0 6px"><div style="width: 32%; height: 4px; border-radius: 2px; background: #FFFFFF"></div></div>
          <div style="display: flex; align-items: center; justify-content: space-between">
            <button type="button" aria-label="Faixa anterior" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M19 5.5v13L9.5 12z"></path></svg></button>
            <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 80px; height: 80px; border: 0; border-radius: 40px; background: #AEEDFF; color: #06343F; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <sc-if value="{{paused}}" hint-placeholder-val="{{true}}"><svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"></path></svg></sc-if>
              <sc-if value="{{playing}}" hint-placeholder-val="{{false}}"><svg width="38" height="38" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect></svg></sc-if>
            </button>
            <button type="button" aria-label="Próxima faixa" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"></path><path d="M5 5.5v13l9.5-6.5z"></path></svg></button>
          </div>
        </div>
      </section>

      <sc-if value="{{showSugg}}" hint-placeholder-val="{{false}}">
        <section aria-label="Sugestões" style="order: 2; flex: none; box-sizing: border-box; padding: 6px; border-radius: 24px; background: {{c.card}}; display: flex; flex-direction: column">
          <button type="button" style="height: 88px; border: 0; border-radius: 18px; background: transparent; color: {{c.text}}; font: inherit; display: flex; align-items: center; gap: 16px; padding: 0 14px; cursor: pointer; text-align: left">
            <span style="width: 56px; height: 56px; flex: none; border-radius: 28px; background: {{c.pill}}; color: {{c.accent}}; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5 9.5V21h14V9.5"></path></svg></span>
            <span><span style="display: block; font-size: 24px; font-weight: 500">Casa</span><span style="display: block; font-size: 19px; color: {{c.muted}}">12 min · Navegar com Waze</span></span>
          </button>
          <button type="button" style="height: 88px; border: 0; border-radius: 18px; background: transparent; color: {{c.text}}; font: inherit; display: flex; align-items: center; gap: 16px; padding: 0 14px; cursor: pointer; text-align: left">
            <span style="width: 56px; height: 56px; flex: none; border-radius: 28px; background: {{c.pill}}; color: {{c.accent}}; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg></span>
            <span><span style="display: block; font-size: 24px; font-weight: 500">Trabalho</span><span style="display: block; font-size: 19px; color: {{c.muted}}">25 min · Navegar com Waze</span></span>
          </button>
        </section>
      </sc-if>

      <sc-if value="{{showWidgets}}" hint-placeholder-val="{{false}}">
        <section aria-label="Clima" style="order: 2; flex: none; height: 140px; box-sizing: border-box; padding: 18px 22px; border-radius: 24px; background: {{c.card}}; display: flex; align-items: center; gap: 18px">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="3.5" stroke="#FDD663" stroke-width="1.8"></circle><path d="M8 1.5v1.5M2.5 8H1M3.6 3.6l1 1M12.4 3.6l-1 1" stroke="#FDD663" stroke-width="1.8"></path><path d="M9 20h9a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.4 1.2A3.4 3.4 0 0 0 9 20z" stroke="{{c.text}}" stroke-width="1.8"></path></svg>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; align-items: baseline; gap: 10px"><span style="font-size: 48px; font-weight: 400; line-height: 1">24°</span><span style="font-size: 20px; color: {{c.muted}}">17° / 27°</span></div>
            <div style="font-size: 20px; color: {{c.muted}}; margin-top: 6px">Parcialmente nublado · São Paulo</div>
          </div>
        </section>
        <section aria-label="Veículo" style="order: 3; flex: none; height: 140px; box-sizing: border-box; padding: 18px 22px; border-radius: 24px; background: {{c.card}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center">
          <div><div style="font-size: 32px; font-weight: 400">12,6 V</div><div style="font-size: 18px; color: {{c.muted}}; margin-top: 4px">Bateria</div></div>
          <div><div style="font-size: 32px; font-weight: 400">48</div><div style="font-size: 18px; color: {{c.muted}}; margin-top: 4px">km/h</div></div>
          <div><div style="font-size: 32px; font-weight: 400; color: {{c.accent}}">Acesos</div><div style="font-size: 18px; color: {{c.muted}}; margin-top: 4px">Faróis</div></div>
        </section>
      </sc-if>
    </div>
  </main>

  <sc-if value="{{isHorizontal}}" hint-placeholder-val="{{false}}">
    <dc-import name="Taskbar" theme="{{theme}}" badge="{{badge}}" clima="{{clima}}" hint-size="1280px,88px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["noite","dia"],"default":"noite"},"barra":{"editor":"enum","options":["vertical","horizontal"],"default":"vertical"},"painel":{"editor":"enum","options":["mensagem","midia","sugestoes","widgets"],"default":"mensagem","tsType":"cards da coluna direita"},"nav":{"editor":"enum","options":["navegando","livre"],"default":"navegando"},"badge":{"editor":"text","default":"3"},"clima":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: false };
  }
  renderVals() {
    const P = {
      noite: { bg: '#151616', card: '#252626', pill: '#3C3E3D', text: '#E3E3E3', muted: '#A8ABAE', primary: '#C5D4FF', onPrimary: '#0B2A66', accent: '#8AB4F8' },
      dia: { bg: '#E9EBEE', card: '#FFFFFF', pill: '#E8EAED', text: '#1F1F1F', muted: '#5F6368', primary: '#D3E3FD', onPrimary: '#041E49', accent: '#0B57D0' }
    };
    const theme = this.props.theme === 'dia' ? 'dia' : 'noite';
    const vertical = (this.props.barra ?? 'vertical') !== 'horizontal';
    const painel = this.props.painel ?? 'mensagem';
    const playing = this.state.playing;
    return {
      c: P[theme],
      theme,
      nav: this.props.nav ?? 'navegando',
      badge: this.props.badge ?? '3',
      clima: !!this.props.clima,
      dir: vertical ? 'row' : 'column',
      pad: vertical ? '12px 12px 12px 0' : '12px 12px 0 12px',
      isVertical: vertical,
      isHorizontal: !vertical,
      showMsg: painel === 'mensagem',
      showSugg: painel === 'sugestoes',
      showWidgets: painel === 'widgets',
      mediaOrder: painel === 'mensagem' ? 1 : 0,
      playing,
      paused: !playing,
      playLabel: playing ? 'Pausar' : 'Tocar',
      togglePlay: () => this.setState({ playing: !this.state.playing })
    };
  }
}
</script>
</body>
</html>
