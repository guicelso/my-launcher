<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Navegação de mídia em abas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; background: #151616; color: #E3E3E3; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="noite" aberto="apps" badge="" hint-size="96px,720px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 12px 12px 0; display: flex">
    <section aria-label="Sonora · navegação" style="flex: 1; min-width: 0; position: relative; box-sizing: border-box; padding: 12px 20px 12px 12px; border-radius: 24px; background: #262625; display: flex; flex-direction: column; overflow: hidden">

      <header style="height: 88px; flex: none; display: flex; align-items: center; gap: 10px">
        <a href="MxSources.dc.html" aria-label="Trocar app de mídia (Sonora)" style="height: 64px; padding: 0 14px 0 8px; border-radius: 32px; display: flex; align-items: center; gap: 10px; color: #E3E3E3; text-decoration: none; background: rgba(255,255,255,0.08); margin-right: 12px">
          <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: #F6B26B; color: #3A2300; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"></path></svg></span>
          <span style="font-size: 24px">Sonora</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
        </a>
        <nav aria-label="Abas do app" style="display: flex; gap: 6px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
            <button type="button" aria-current="{{t.current}}" onClick="{{t.pick}}" style="height: 64px; padding: 0 20px; border: 0; border-radius: 32px; background: {{t.bg}}; color: #E3E3E3; opacity: {{t.opacity}}; font: inherit; font-size: 22px; display: flex; align-items: center; gap: 10px; cursor: pointer">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}
            </button>
          </sc-for>
        </nav>
        <span style="flex: 1"></span>
        <a href="MxSearch.dc.html" aria-label="Buscar" style="width: 76px; height: 76px; border-radius: 38px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.8-4.8"></path></svg></a>
      </header>

      <sc-if value="{{driving}}" hint-placeholder-val="{{false}}">
        <div role="status" style="flex: none; margin: 0 0 8px 88px; height: 52px; padding: 0 20px; border-radius: 26px; background: #3B3A2A; color: #F3E7A9; display: flex; align-items: center; gap: 12px; font-size: 20px; align-self: flex-start">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14l-1.5-6h-11zM7 17v2M17 17v2M8 11l1.5-4h5L16 11"></path></svg>
          Em movimento: até 21 itens por lista. Busca só por voz.
        </div>
      </sc-if>

      <div style="flex: 1; min-height: 0; display: flex; gap: 12px">
        <div style="width: 76px; flex: none; display: flex; flex-direction: column; align-items: center; padding-bottom: 8px">
          <button type="button" aria-label="Rolar para cima" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #747775; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg></button>
          <div style="flex: 1; width: 4px; border-radius: 2px; background: #3C3E3D; position: relative"><span style="position: absolute; top: 0; left: 0; width: 4px; height: 35%; border-radius: 2px; background: #C4C7C5"></span></div>
          <sc-if value="{{az}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-label="Pular por letra" style="width: 64px; height: 64px; margin: 8px 0; border: 0; border-radius: 32px; background: rgba(255,255,255,0.1); color: #E3E3E3; font: inherit; font-size: 20px; font-weight: 500; cursor: pointer">A–Z</button>
          </sc-if>
          <button type="button" aria-label="Rolar para baixo" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        </div>

        <div style="flex: 1; min-width: 0; overflow-y: auto; padding-right: 8px">
          <sc-if value="{{isGrid}}" hint-placeholder-val="{{true}}">
            <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
              <h2 style="margin: 0; height: 56px; display: flex; align-items: center; font-size: 24px; font-weight: 500; color: #E3E3E3">{{g.title}}</h2>
              <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px; margin-bottom: 16px">
                <sc-for list="{{g.items}}" as="it" hint-placeholder-count="5">
                  <a href="{{it.href}}" style="display: flex; flex-direction: column; gap: 8px; color: #E3E3E3; text-decoration: none">
                    <span aria-hidden="true" style="width: 100%; aspect-ratio: 1; border-radius: {{it.radius}}; overflow: hidden; background: {{it.a}}; position: relative"><span style="position: absolute; right: -18%; top: -14%; width: 72%; height: 72%; border-radius: 50%; background: {{it.b}}"></span><span style="position: absolute; left: 12%; bottom: 12%; width: 30%; height: 30%; border-radius: 50%; background: {{it.c}}"></span></span>
                    <span style="font-size: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span>
                    <span style="font-size: 18px; color: #A8ABAE; margin-top: -4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span>
                  </a>
                </sc-for>
              </div>
            </sc-for>
          </sc-if>

          <sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
              <sc-if value="{{r.isHeader}}" hint-placeholder-val="{{false}}">
                <h2 style="margin: 0; height: 56px; display: flex; align-items: flex-end; padding: 0 0 8px 8px; box-sizing: border-box; font-size: 22px; font-weight: 500; color: #C4C7C5">{{r.title}}</h2>
              </sc-if>
              <sc-if value="{{r.isItem}}" hint-placeholder-val="{{true}}">
                <a href="{{r.href}}" style="height: 100px; display: flex; align-items: center; gap: 22px; padding: 0 8px; color: #E3E3E3; text-decoration: none; opacity: {{r.dim}}">
                  <span aria-hidden="true" style="width: 72px; height: 72px; flex: none; border-radius: {{r.radius}}; overflow: hidden; background: {{r.a}}; position: relative"><span style="position: absolute; right: -14px; top: -10px; width: 52px; height: 52px; border-radius: 26px; background: {{r.b}}"></span></span>
                  <span style="flex: 1; min-width: 0; height: 100px; box-sizing: border-box; border-bottom: 1px solid #3C3E3D; display: flex; flex-direction: column; justify-content: center">
                    <span style="font-size: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
                    <span style="display: flex; align-items: center; gap: 8px; font-size: 21px; color: #A8ABAE; margin-top: 4px">
                      <sc-if value="{{r.explicit}}" hint-placeholder-val="{{false}}"><span aria-label="Explícito" style="width: 22px; height: 22px; border-radius: 4px; background: #A8ABAE; color: #262625; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">E</span></sc-if>
                      <sc-if value="{{r.saved}}" hint-placeholder-val="{{false}}"><svg aria-label="Baixado" role="img" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></sc-if>
                      <sc-if value="{{r.done}}" hint-placeholder-val="{{false}}"><svg aria-label="Concluído" role="img" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"></path></svg></sc-if>
                      <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
                    </span>
                    <sc-if value="{{r.progress}}" hint-placeholder-val="{{false}}"><span aria-label="Em andamento: {{r.pctLabel}}" style="display: block; height: 4px; margin-top: 10px; margin-right: 24px; border-radius: 2px; background: #474747"><span style="display: block; width: {{r.pct}}; height: 4px; border-radius: 2px; background: #F6B26B"></span></span></sc-if>
                  </span>
                  <sc-if value="{{r.isNew}}" hint-placeholder-val="{{false}}"><span aria-label="Novo" style="width: 16px; height: 16px; flex: none; margin-right: 16px; border-radius: 8px; background: #F6B26B"></span></sc-if>
                </a>
              </sc-if>
            </sc-for>
          </sc-if>

          <sc-if value="{{isCat}}" hint-placeholder-val="{{false}}">
            <h2 style="margin: 0; height: 56px; display: flex; align-items: center; font-size: 24px; font-weight: 500">Gêneros e momentos</h2>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
              <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
                <a href="MxAlbum.dc.html" style="height: 104px; box-sizing: border-box; padding: 0 20px; border-radius: 20px; background: #333534; color: #E3E3E3; text-decoration: none; display: flex; align-items: center; gap: 16px; font-size: 24px">
                  <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#E3E3E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>{{c.label}}
                </a>
              </sc-for>
            </div>
          </sc-if>

          <sc-if value="{{driving}}" hint-placeholder-val="{{false}}">
            <div style="height: 88px; margin: 8px 0; border: 2px dashed #5C5F5E; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 22px; color: #A8ABAE">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
              Mais itens com o carro parado
            </div>
          </sc-if>
        </div>
      </div>

      <div style="flex: none; position: relative; height: 104px; margin-top: 8px; border-radius: 20px; background: #343635; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px; overflow: hidden">
        <span aria-hidden="true" style="position: absolute; left: 0; top: 0; height: 4px; width: 100%; background: #464A4D"><span style="display: block; width: 42%; height: 4px; background: #F6B26B"></span></span>
        <a href="MxPlayer.dc.html" aria-label="Abrir tocando agora: Estrada de terra ao entardecer" style="flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 18px; color: #E3E3E3; text-decoration: none">
          <span aria-hidden="true" style="width: 72px; height: 72px; flex: none; border-radius: 12px; overflow: hidden; background: #1D5C63; position: relative"><span style="position: absolute; right: -10px; top: -8px; width: 50px; height: 50px; border-radius: 25px; background: #F6B26B"></span><span style="position: absolute; left: 8px; bottom: 6px; width: 30px; height: 22px; border-radius: 12px; background: #E98A7B"></span></span>
          <span style="min-width: 0; display: flex; flex-direction: column">
            <span style="font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Estrada de terra ao entardecer</span>
            <span style="font-size: 20px; color: #A8ABAE">Banda Fictícia</span>
          </span>
        </a>
        <button type="button" aria-label="Faixa anterior" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M19 5.5v13L9.5 12z"></path></svg></button>
        <button type="button" aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 88px; height: 76px; border: 0; border-radius: {{playRadius}}; background: #CFD6D3; color: #151616; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"></path></svg></sc-if>
        </button>
        <button type="button" aria-label="Próxima faixa" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: transparent; color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14M5 5.5v13l9.5-6.5z"></path></svg></button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"aba":{"editor":"enum","options":["inicio","biblioteca","podcasts","explorar"],"default":"inicio","tsType":"aba aberta (os filhos navegáveis do root viram abas, até 4)"},"movimento":{"editor":"boolean","default":false,"tsType":"carro andando: limite de itens e aviso"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: null, playing: true };
  }
  renderVals() {
    const tab = this.state.tab ?? this.props.aba ?? 'inicio';
    const driving = !!this.props.movimento;
    const T = [
      { id: 'inicio', label: 'Início', icon: 'M4 11 12 4l8 7v9H4z' },
      { id: 'biblioteca', label: 'Biblioteca', icon: 'M5 4v16M10 4v16M15 5l4 15' },
      { id: 'podcasts', label: 'Podcasts', icon: 'M12 3a4 4 0 0 1 4 4v4a4 4 0 0 1-8 0V7a4 4 0 0 1 4-4zM5 11a7 7 0 0 0 14 0M12 18v3' },
      { id: 'explorar', label: 'Explorar', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15.5 8.5l-2 5-5 2 2-5z' }
    ];
    const tabs = T.map((t) => ({ ...t, current: t.id === tab ? 'page' : 'false', bg: t.id === tab ? 'rgba(255,255,255,0.14)' : 'transparent', opacity: t.id === tab ? 1 : 0.55, pick: () => this.setState({ tab: t.id }) }));
    const P = [['#1D5C63', '#F6B26B', '#E98A7B'], ['#3A2E5C', '#A8C7FA', '#F28B82'], ['#5B3A1E', '#FDD663', '#81C995'], ['#0F3D2A', '#81C995', '#FDE293'], ['#4A1D3B', '#F28B82', '#A8C7FA'], ['#20344F', '#8AB4F8', '#FCAD70']];
    const art = (i) => ({ a: P[i % 6][0], b: P[i % 6][1], c: P[i % 6][2] });
    const gi = (title, sub, i, round) => ({ title, sub, ...art(i), radius: round ? '50%' : '16px', href: round ? 'MxAlbum.dc.html' : 'MxAlbum.dc.html' });
    const groups = [
      { title: 'Continuar ouvindo', items: [gi('Horizonte', 'Banda Fictícia', 0), gi('Conversa de Estrada', 'Podcast', 1), gi('Viagem longa', 'Playlist', 2), gi('Duo Litoral', 'Artista', 3, true), gi('Manhã tranquila', 'Mix diário', 4)] },
      { title: 'Para a estrada', items: [gi('Rodovia', 'Playlist', 5), gi('Fim de tarde', 'Duo Litoral', 3), gi('Acústico', 'Playlist', 2), gi('Noite na serra', 'Álbum', 0), gi('Clássicos', 'Playlist', 4)] }
    ];
    const H = (title) => ({ isHeader: true, isItem: false, title });
    const R = (title, sub, i, x) => ({ isHeader: false, isItem: true, title, sub, ...art(i), radius: '10px', href: 'MxAlbum.dc.html', explicit: false, saved: false, done: false, progress: false, isNew: false, pct: '0%', pctLabel: '', dim: 1, ...x });
    const lib = [
      H('Playlists'), R('Viagem longa', 'Playlist · 48 músicas', 2, { saved: true }), R('Rodovia', 'Playlist · 32 músicas', 5),
      H('Álbuns'), R('Horizonte', 'Banda Fictícia · 2026', 0, { explicit: true, saved: true }), R('Noite na serra', 'Alice Brito · 2025', 4),
      H('Artistas'), R('Duo Litoral', 'Artista', 3, { radius: '36px' }), R('Banda da Estrada', 'Artista', 1, { radius: '36px' })
    ];
    const pod = [
      H('Novos episódios'), R('Ep. 215 — Postos com boa comida', 'Conversa de Estrada · hoje · 47 min', 1, { isNew: true, saved: true }), R('Resumo do dia', 'Notícias em 10 · hoje · 10 min', 5, { isNew: true }),
      H('Em andamento'), R('Ep. 214 — Viagens longas sem cansaço', 'Conversa de Estrada · faltam 34 min', 1, { progress: true, pct: '35%', pctLabel: '35%' }), R('Capítulo 7', 'Audiolivro · O mapa · faltam 21 min', 2, { progress: true, pct: '72%', pctLabel: '72%' }),
      H('Concluídos'), R('Ep. 213 — Revisão antes de viajar', 'Conversa de Estrada · 41 min', 1, { done: true, dim: 0.6 })
    ];
    const cats = [
      ['Pop', 'M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM19 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z'], ['Rock', 'm13 3-8 10h6l-1 8 8-10h-6z'], ['MPB', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v8M8 12h8'], ['Sertanejo', 'M4 20 12 4l8 16M8 13h8'],
      ['Samba', 'M4 12a8 4 0 1 0 16 0 8 4 0 1 0-16 0M4 12v4a8 4 0 0 0 16 0v-4'], ['Para dirigir', 'M5 17h14l-1.5-6h-11zM7 17v2M17 17v2M8 11l1.5-4h5L16 11'], ['Relaxar', 'M12 21c-4-3-7-6-7-10a7 7 0 0 1 14 0c0 4-3 7-7 10z'], ['Paradas', 'M5 20V10M12 20V4M19 20v-7'],
      ['Infantil', 'M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM6 21a6 6 0 0 1 12 0'], ['Rádios', 'M4 9h16v11H4zM7 9l9-5M8 15h.01M16 13v4'], ['Audiolivros', 'M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-7'], ['Notícias', 'M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5']
    ].map(([label, icon]) => ({ label, icon }));
    return {
      tabs, driving,
      isGrid: tab === 'inicio', isList: tab === 'biblioteca' || tab === 'podcasts', isCat: tab === 'explorar',
      az: tab === 'biblioteca',
      groups, rows: tab === 'podcasts' ? pod : lib, cats,
      playing: this.state.playing, paused: !this.state.playing,
      playLabel: this.state.playing ? 'Pausar' : 'Tocar',
      playRadius: this.state.playing ? '20px' : '38px',
      togglePlay: () => this.setState({ playing: !this.state.playing })
    };
  }
}
</script>
</body>
</html>
