<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Buscar no app de mídia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; background: #151616; color: #E3E3E3; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="noite" aberto="apps" badge="" hint-size="96px,720px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 12px 12px 0; display: flex">
    <section aria-label="Buscar em Sonora" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 20px 16px 12px; border-radius: 24px; background: #262625; display: flex; flex-direction: column; overflow: hidden">
      <header style="height: 88px; flex: none; display: flex; align-items: center; gap: 12px">
        <a href="MxBrowse.dc.html" aria-label="Voltar" style="width: 76px; height: 76px; border-radius: 38px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 18l-6-6 6-6"></path></svg></a>
        <sc-if value="{{typing}}" hint-placeholder-val="{{true}}">
          <label style="flex: 1; height: 68px; box-sizing: border-box; padding: 0 12px 0 24px; border-radius: 34px; background: #3A3C3B; display: flex; align-items: center; gap: 14px; font-size: 26px">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C4C7C5" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m20 20-4.8-4.8"></path></svg>
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Buscar em Sonora</span>
            <input type="search" value="estrada" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #E3E3E3; font: inherit; font-size: 26px">
            <button type="button" aria-label="Limpar" style="width: 56px; height: 56px; border: 0; border-radius: 28px; background: transparent; color: #C4C7C5; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
          </label>
        </sc-if>
        <sc-if value="{{driving}}" hint-placeholder-val="{{false}}">
          <div aria-disabled="true" style="flex: 1; height: 68px; box-sizing: border-box; padding: 0 24px; border-radius: 34px; border: 2px dashed #5C5F5E; display: flex; align-items: center; gap: 14px; font-size: 22px; color: #8E918F">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            Teclado indisponível com o carro em movimento
          </div>
        </sc-if>
        <button type="button" aria-label="Buscar por voz" style="width: 76px; height: 76px; border: 0; border-radius: 38px; background: rgba(255,255,255,0.1); color: #E3E3E3; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="#F6B26B"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
      </header>

      <sc-if value="{{typing}}" hint-placeholder-val="{{true}}">
        <div style="flex: 1; min-height: 0; display: flex; gap: 24px; padding: 4px 0 12px 88px">
          <div style="flex: 1.3; min-width: 0">
            <h2 style="margin: 0 0 4px; font-size: 20px; font-weight: 500; color: #C4C7C5">Músicas</h2>
            <sc-for list="{{songs}}" as="s" hint-placeholder-count="2">
              <a href="MxPlayer.dc.html" style="height: 80px; display: flex; align-items: center; gap: 18px; color: #E3E3E3; text-decoration: none; border-bottom: 1px solid #3C3E3D">
                <span aria-hidden="true" style="width: 60px; height: 60px; flex: none; border-radius: 10px; background: {{s.a}}; position: relative; overflow: hidden"><span style="position: absolute; right: -10px; top: -8px; width: 42px; height: 42px; border-radius: 21px; background: {{s.b}}"></span></span>
                <span style="min-width: 0; display: flex; flex-direction: column"><span style="font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span><span style="font-size: 19px; color: #A8ABAE">{{s.sub}}</span></span>
              </a>
            </sc-for>
          </div>
          <div style="flex: 1; min-width: 0">
            <h2 style="margin: 0 0 8px; font-size: 20px; font-weight: 500; color: #C4C7C5">Artistas e álbuns</h2>
            <div style="display: flex; gap: 20px">
              <sc-for list="{{others}}" as="o" hint-placeholder-count="3">
                <a href="MxAlbum.dc.html" style="width: 112px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #E3E3E3; text-decoration: none; font-size: 19px; text-align: center">
                  <span aria-hidden="true" style="width: 104px; height: 104px; border-radius: {{o.radius}}; background: {{o.a}}; position: relative; overflow: hidden"><span style="position: absolute; right: -16px; top: -12px; width: 70px; height: 70px; border-radius: 35px; background: {{o.b}}"></span></span>
                  {{o.title}}
                </a>
              </sc-for>
            </div>
          </div>
        </div>

        <div role="group" aria-label="Teclado" style="flex: none; padding: 12px; border-radius: 20px; background: #1C1D1D; display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{rows}}" as="row" hint-placeholder-count="3">
            <div style="display: flex; justify-content: center; gap: 8px">
              <sc-for list="{{row.keys}}" as="k" hint-placeholder-count="10">
                <button type="button" aria-label="{{k.label}}" style="width: {{k.w}}; height: 56px; border: 0; border-radius: 12px; background: {{k.bg}}; color: {{k.fg}}; font: inherit; font-size: 24px; cursor: pointer">{{k.t}}</button>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{driving}}" hint-placeholder-val="{{false}}">
        <div style="flex: 1; min-height: 0; display: flex; align-items: center; gap: 64px; padding: 0 40px 0 120px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
            <button type="button" aria-label="Toque para falar" style="width: 176px; height: 176px; border: 0; border-radius: 88px; background: #F6B26B; color: #3A2300; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 16px rgba(246,178,107,0.18)"><svg width="72" height="72" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="currentColor"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
            <span style="font-size: 26px">Diga o que quer ouvir</span>
            <span style="font-size: 20px; color: #A8ABAE">Ex.: "tocar Duo Litoral"</span>
          </div>
          <div style="flex: 1; min-width: 0">
            <h2 style="margin: 0 0 8px; font-size: 22px; font-weight: 500; color: #C4C7C5">Buscas recentes</h2>
            <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
              <a href="MxPlayer.dc.html" style="height: 88px; display: flex; align-items: center; gap: 18px; color: #E3E3E3; text-decoration: none; border-bottom: 1px solid #3C3E3D; font-size: 25px">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#A8ABAE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 8v4l3 2"></path></svg>{{r}}
              </a>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modo":{"editor":"enum","options":["teclado","movimento"],"default":"teclado","tsType":"parado (teclado) ou em movimento (só voz)"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const driving = (this.props.modo ?? 'teclado') === 'movimento';
    const key = (t, x) => ({ t, label: t, w: '84px', bg: '#3A3C3B', fg: '#E3E3E3', ...x });
    const letters = (s) => s.split('').map((c) => key(c));
    const rows = [
      { keys: letters('qwertyuiop') },
      { keys: letters('asdfghjklç') },
      { keys: [key('⇧', { label: 'Maiúsculas', w: '120px', bg: '#2C2E2D' }), ...letters('zxcvbnm'), key('⌫', { label: 'Apagar', w: '120px', bg: '#2C2E2D' })] },
      { keys: [key('?123', { label: 'Números e símbolos', w: '140px', bg: '#2C2E2D' }), key('espaço', { label: 'Espaço', w: '520px' }), key('Buscar', { label: 'Buscar', w: '180px', bg: '#F6B26B', fg: '#3A2300' })] }
    ];
    return {
      driving, typing: !driving, rows,
      songs: [
        { title: 'Estrada de terra ao entardecer', sub: 'Banda Fictícia · Horizonte', a: '#1D5C63', b: '#F6B26B' },
        { title: 'Estrada da serra', sub: 'Duo Litoral', a: '#0F3D2A', b: '#81C995' }
      ],
      others: [
        { title: 'Banda da Estrada', radius: '52px', a: '#3A2E5C', b: '#A8C7FA' },
        { title: 'Estradas (álbum)', radius: '14px', a: '#5B3A1E', b: '#FDD663' },
        { title: 'Rodovia', radius: '14px', a: '#20344F', b: '#8AB4F8' }
      ],
      recent: ['Duo Litoral', 'Conversa de Estrada', 'Músicas para dirigir à noite']
    };
  }
}
</script>
</body>
</html>
