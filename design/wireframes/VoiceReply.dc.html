<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Responder por voz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; font-family: Roboto, system-ui, sans-serif; color: #E3E3E3">
  <dc-import name="Main" theme="noite" painel="midia" nav="navegando" badge="3" hint-size="1280px,720px"></dc-import>
  <div aria-hidden="true" style="position: absolute; top: 0; right: 0; bottom: 0; left: 96px; background: rgba(0,0,0,0.6)"></div>

  <section aria-label="Comando de voz" aria-live="polite" style="position: absolute; left: 96px; right: 12px; bottom: 12px; box-sizing: border-box; padding: 24px 28px 24px 32px; border-radius: 24px; background: #292A2A; box-shadow: 0 -4px 24px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="position: relative; width: 56px; height: 56px; flex: none; border-radius: 28px; background: #8E6BBF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500">MS</span>
      <span style="flex: 1; font-size: 22px; color: #A8ABAE">Mariana Souza · WhatsApp</span>
      <div aria-hidden="true" style="display: flex; gap: 8px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{d.bg}}"></span></sc-for>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 28px; min-height: 120px">
      <span aria-hidden="true" style="width: 88px; height: 88px; flex: none; border-radius: 44px; background: {{micBg}}; color: {{micFg}}; display: flex; align-items: center; justify-content: center">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="currentColor"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"></path></svg>
      </span>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 22px; color: #A8ABAE">{{prompt}}</div>
        <div style="font-size: 32px; line-height: 1.3; margin-top: 6px">{{body}}</div>
      </div>
    </div>

    <div style="display: flex; gap: 14px; justify-content: flex-end">
      <sc-if value="{{showCancel}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{cancel}}" style="height: 76px; padding: 0 40px; border: 0; border-radius: 38px; background: #3C3E3D; color: #E3E3E3; font: inherit; font-size: 22px; font-weight: 500; cursor: pointer">{{cancelLabel}}</button>
      </sc-if>
      <button type="button" onClick="{{next}}" style="height: 76px; padding: 0 44px; border: 0; border-radius: 38px; background: #C5D4FF; color: #0B2A66; font: inherit; font-size: 22px; font-weight: 500; cursor: pointer">{{nextLabel}}</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etapa":{"editor":"enum","options":["ouvindo","ditando","confirmar","enviada"],"default":"confirmar"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: null };
  }
  renderVals() {
    const order = ['ouvindo', 'ditando', 'confirmar', 'enviada'];
    const step = this.state.step ?? (this.props.etapa ?? 'confirmar');
    const i = Math.max(0, order.indexOf(step));
    const S = {
      ouvindo: { prompt: 'Lendo a mensagem', body: '“Você chega que horas? Já estou aqui.” Quer responder?', next: 'Responder', cancel: 'Agora não' },
      ditando: { prompt: 'Qual é a mensagem?', body: 'Vou me atrasar 10 minutos, pode começar sem mim…', next: 'Pronto', cancel: 'Cancelar' },
      confirmar: { prompt: 'Mensagem para Mariana Souza. Quer enviar?', body: '“Vou me atrasar 10 minutos, pode começar sem mim. Te encontro lá.”', next: 'Enviar', cancel: 'Cancelar' },
      enviada: { prompt: 'Pronto', body: 'Mensagem enviada para Mariana Souza.', next: 'Fechar', cancel: '' }
    }[order[i]];
    const listening = order[i] === 'ditando';
    return {
      prompt: S.prompt,
      body: S.body,
      nextLabel: S.next,
      cancelLabel: S.cancel,
      showCancel: S.cancel !== '',
      micBg: listening ? '#8AB4F8' : '#3C3E3D',
      micFg: listening ? '#0B1A33' : '#E3E3E3',
      dots: order.map((_, k) => ({ bg: k <= i ? '#8AB4F8' : '#474747' })),
      next: () => this.setState({ step: order[(i + 1) % order.length] }),
      cancel: () => this.setState({ step: 'ouvindo' })
    };
  }
}
</script>
</body>
</html>
