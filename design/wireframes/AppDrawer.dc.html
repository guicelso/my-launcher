<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Apps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; background: #000000; color: #E8EAED; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="noite" active="apps" hint-size="104px,720px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 20px 32px 24px 24px; display: flex; flex-direction: column; gap: 16px; background: #121316; border-radius: 28px 0 0 28px">
    <header style="display: flex; align-items: center; gap: 16px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 500; flex: 1">Apps</h1>
      <label style="width: 380px; height: 64px; box-sizing: border-box; border-radius: 32px; background: #2B2C30; display: flex; align-items: center; gap: 12px; padding: 0 22px; color: #A9ADB3">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar app</span>
        <input type="search" placeholder="Buscar app" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #E8EAED; font: inherit; font-size: 20px">
      </label>
      <button type="button" style="height: 64px; border: 0; border-radius: 32px; background: #2B2C30; color: #E8EAED; font: inherit; font-size: 18px; font-weight: 500; padding: 0 24px; cursor: pointer">Editar barra</button>
    </header>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 176px; gap: 8px 8px; align-content: start">
      <sc-for list="{{apps}}" as="app" hint-placeholder-count="18">
        <sc-if value="{{app.isLink}}" hint-placeholder-val="{{false}}">
          <a href="Settings.dc.html" style="border-radius: 24px; color: #E8EAED; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
            <span style="width: 96px; height: 96px; border-radius: 48px; background: {{app.bg}}; color: {{app.fg}}; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700">{{app.letter}}</span>
            <span style="font-size: 18px; text-align: center; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{app.name}}</span>
          </a>
        </sc-if>
        <sc-if value="{{app.isButton}}" hint-placeholder-val="{{true}}">
          <button type="button" style="border: 0; border-radius: 24px; background: transparent; color: #E8EAED; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: pointer">
            <span style="width: 96px; height: 96px; border-radius: 48px; background: {{app.bg}}; color: {{app.fg}}; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700">{{app.letter}}</span>
            <span style="font-size: 18px; text-align: center; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{app.name}}</span>
          </button>
        </sc-if>
      </sc-for>
    </div>
    <div aria-hidden="true" style="display: flex; justify-content: center; gap: 8px">
      <span style="width: 24px; height: 8px; border-radius: 4px; background: #E8EAED"></span>
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #5F6368"></span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['Waze', 'W', '#3FB8E8', '#04212E'],
      ['Google Maps', 'M', '#34A853', '#FFFFFF'],
      ['HERE WeGo', 'H', '#48DAD0', '#04221F'],
      ['Spotify', 'S', '#1DB954', '#04210F'],
      ['YouTube Music', 'Y', '#FF4E45', '#2A0300'],
      ['SoundCloud', 'S', '#FF7A1A', '#2A1100'],
      ['Rádio', 'R', '#FBBC04', '#2A1F00'],
      ['Música USB', 'U', '#A142F4', '#FFFFFF'],
      ['Telefone', 'T', '#34A853', '#FFFFFF'],
      ['WhatsApp', 'W', '#25D366', '#052E16'],
      ['YouTube', 'Y', '#FF4E45', '#2A0300'],
      ['Vídeo', 'V', '#5F6368', '#FFFFFF'],
      ['Equalizador', 'E', '#8AB4F8', '#0B1A33'],
      ['Ajustes do carro', 'C', '#5F6368', '#FFFFFF'],
      ['Espelhamento', 'Z', '#F28B82', '#2A0300'],
      ['Navegador', 'N', '#8AB4F8', '#0B1A33'],
      ['Ajustes do launcher', 'A', '#E8EAED', '#202124', true],
      ['Launcher original', 'D', '#3A3B40', '#E8EAED']
    ];
    const apps = raw.map(([name, letter, bg, fg, isLink]) => ({ name, letter, bg, fg, isLink: !!isLink, isButton: !isLink }));
    return { apps };
  }
}
</script>
</body>
</html>
