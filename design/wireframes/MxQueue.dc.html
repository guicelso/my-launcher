<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fila</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1280px; height: 720px; display: flex; background: #151616; color: #E3E3E3; font-family: Roboto, system-ui, sans-serif; overflow: hidden">
  <dc-import name="Rail" theme="noite" aberto="apps" badge="" hint-size="96px,720px"></dc-import>
  <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 12px 12px 12px 0; display: flex">
    <section aria-label="Fila de reprodução" style="flex: 1; min-width: 0; position: relative; border-radius: 24px; background: #262625; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: -80px; filter: blur(60px) saturate(1.15); opacity: 0.9">
        <svg viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><rect width="400" height="400" fill="#1D5C63"></rect><circle cx="250" cy="130" r="120" fill="#F6B26B"></circle><ellipse cx="110" cy="300" rx="130" ry="90" fill="#E98A7B"></ellipse></svg>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(12, 13, 13, 0.78)"></div>

      <div style="position: relative; height: 100%; box-sizing: border-box; padding: 12px 24px 0 12px; display: flex; flex-direction: column">
        <header style="height: 88px; flex: none; display: flex; align-items: center; gap: 12px">
          <a href="MxPlayer.dc.html" aria-label="Voltar ao tocando agora" style="width: 76px; height: 76px; border-radius: 38px; color: #E3E3E3; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 18l-6-6 6-6"></path></svg></a>
          <div style="flex: 1; min-width: 0">
            <h1 style="margin: 0; font-size: 30px; font-weight: 400">Fila</h1>
            <div style="font-size: 20px; color: #B8BBB9">Viagem longa · 48 músicas</div>
          </div>
          <span style="height: 44px; padding: 0 16px; border-radius: 22px; background: rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px; font-size: 19px; color: #C4C7C5"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>2 já tocadas acima</span>
        </header>

        <ol style="flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0 0 0 88px; list-style: none">
          <sc-for list="{{items}}" as="q" hint-placeholder-count="6">
            <li style="opacity: {{q.dim}}">
              <a href="MxPlayer.dc.html" aria-current="{{q.current}}" style="height: 96px; display: flex; align-items: center; gap: 22px; padding: 0 20px 0 12px; margin-bottom: 4px; border-radius: 20px; background: {{q.bg}}; color: #E3E3E3; text-decoration: none">
                <span aria-hidden="true" style="width: 68px; height: 68px; flex: none; border-radius: 10px; overflow: hidden; background: {{q.a}}; position: relative"><span style="position: absolute; right: -12px; top: -10px; width: 48px; height: 48px; border-radius: 24px; background: {{q.b}}"></span></span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
                  <span style="font-size: 25px; color: {{q.titleColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.title}}</span>
                  <span style="font-size: 20px; color: #B8BBB9">{{q.sub}}</span>
                </span>
                <sc-if value="{{q.playing}}" hint-placeholder-val="{{false}}">
                  <span style="display: flex; align-items: center; gap: 12px; font-size: 20px; color: #F6B26B"><svg aria-label="Tocando agora" role="img" width="28" height="28" viewBox="0 0 24 24" fill="#F6B26B"><rect x="3" y="10" width="4" height="10" rx="1"></rect><rect x="10" y="4" width="4" height="16" rx="1"></rect><rect x="17" y="13" width="4" height="7" rx="1"></rect></svg>1:34 / 3:45</span>
                </sc-if>
                <sc-if value="{{q.other}}" hint-placeholder-val="{{true}}"><span style="font-size: 20px; color: #B8BBB9">{{q.time}}</span></sc-if>
              </a>
            </li>
          </sc-for>
        </ol>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [['#1D5C63', '#F6B26B'], ['#3A2E5C', '#A8C7FA'], ['#5B3A1E', '#FDD663'], ['#0F3D2A', '#81C995'], ['#4A1D3B', '#F28B82'], ['#20344F', '#8AB4F8']];
    const rows = [
      ['Estrada de terra ao entardecer', 'Banda Fictícia', '3:45', 'atual'],
      ['Posto 24 horas', 'Banda Fictícia', '3:12'],
      ['Fim de tarde', 'Duo Litoral', '4:05'],
      ['Lugar nenhum', 'Alice Brito', '3:28'],
      ['Em movimento', 'Banda da Estrada', '2:57'],
      ['Retorno', 'Duo Litoral', '3:40']
    ];
    const items = rows.map(([title, sub, time, s], i) => {
      const cur = s === 'atual';
      return {
        title, sub, time, a: P[i % 6][0], b: P[i % 6][1],
        playing: cur, other: !cur, current: cur ? 'true' : 'false',
        bg: cur ? 'rgba(255,255,255,0.12)' : 'transparent',
        titleColor: cur ? '#F6B26B' : '#E3E3E3',
        dim: 1
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
